name: Deploy to production

# Push (or merge a PR) into main -> build both images on GitHub's runners,
# push them to GHCR, then tell the EC2 box to pull and restart.
# The server never builds anything (it only has ~1.9 GB RAM).
on:
  push:
    branches: [main]
  workflow_dispatch: {}        # manual "Run workflow" button, also deploys main

concurrency:
  group: production-deploy
  cancel-in-progress: false    # never kill a deploy half way; queue the next one

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./client
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image prefix (GHCR requires lowercase)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vcarenursing" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy compose file to server
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.ghcr.yml \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/VCareNursing/docker-compose.ghcr.yml"

      - name: Pull new images and restart
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' TAG='$TAG' OWNER='${{ github.repository_owner }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/VCareNursing
          export IMAGE_OWNER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          export IMAGE_TAG="$TAG"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose -f docker-compose.ghcr.yml pull
          docker compose -f docker-compose.ghcr.yml up -d --remove-orphans
          docker logout ghcr.io
          docker image prune -f >/dev/null

          # Wait for the backend to report healthy (it runs DB migrations on boot).
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/health >/dev/null; then
              echo "Backend healthy after $((i*5))s"; exit 0
            fi
            sleep 5
          done
          echo "Backend did not become healthy in 150s"
          docker compose -f docker-compose.ghcr.yml logs --tail 60 backend
          exit 1
          REMOTE

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
