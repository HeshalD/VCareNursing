# Production compose used by the GitHub Actions deploy (.github/workflows/deploy.yml).
# Pulls prebuilt images from GHCR instead of building on the server.
# Needs backend/.env on the server (already there). Variables are set by the deploy job:
#   IMAGE_OWNER  lowercase GitHub owner      IMAGE_TAG  commit sha (defaults to latest)
services:
  backend:
    image: ghcr.io/${IMAGE_OWNER:-heshald}/vcarenursing-backend:${IMAGE_TAG:-latest}
    container_name: vcarenursing-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"
    networks:
      - vcarenursing-network

  frontend:
    image: ghcr.io/${IMAGE_OWNER:-heshald}/vcarenursing-frontend:${IMAGE_TAG:-latest}
    container_name: vcarenursing-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - vcarenursing-network

networks:
  vcarenursing-network:
    driver: bridge
