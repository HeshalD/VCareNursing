version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: vcarenursing-db
    environment:
      POSTGRES_DB: vcarenursing
      POSTGRES_USER: vcareuser
      POSTGRES_PASSWORD: vcarepass123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - vcarenursing-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vcarenursing-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: vcarenursing
      DB_USER: vcareuser
      DB_PASSWORD: vcarepass123
      # In production, supply the rest via an env_file (see DEPLOYMENT_GUIDE.md):
      #   env_file:
      #     - ./backend/.env
      # Required keys: JWT_SECRET, AWS_REGION, AWS_ACCESS_KEY_ID,
      # AWS_SECRET_ACCESS_KEY, AWS_S3_BUCKET_NAME, EMAIL_*, TWILIO_*,
      # META_WHATSAPP_TOKEN, META_WA_PHONE_NUMBER_ID. See .env.example.
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - vcarenursing-network

  # Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: vcarenursing-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - vcarenursing-network

volumes:
  postgres_data:

networks:
  vcarenursing-network:
    driver: bridge
